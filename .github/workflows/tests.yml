# Run the automated tests on GitHub's Ubuntu machines on every push.
# This is called "Continuous Integration" (CI).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Run the tool (text and JSON)
        run: |
          PYTHONPATH=src python -m linux_diagnostics --redact
          PYTHONPATH=src python -m linux_diagnostics --json --redact | python -m json.tool > /dev/null
